name: Deploy Sanskriti Mall to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare GitHub Pages-safe routes
        shell: bash
        run: |
          rm -rf 'app/order/[id]' 'app/product/[slug]' 'app/admin/[section]'

          python - <<'PY'
          from pathlib import Path
          import re

          prefix = '/Sanskriti-Mall-Premium-Ecommerce'

          for path in list(Path('components').rglob('*.tsx')) + list(Path('app').rglob('*.tsx')):
              text = path.read_text()

              text = text.replace('/product/${product.slug}', '/product?slug=${product.slug}')
              text = text.replace('/product/${related.slug}', '/product?slug=${related.slug}')
              text = text.replace('/order/${order.id}', '/order?id=${order.id}')

              text = re.sub(r'href="/(?!/)', f'href="{prefix}/', text)
              text = re.sub(r"href='/(?!/)", f"href='{prefix}/", text)

              text = text.replace('href={`/product?', f'href={{`{prefix}/product?')
              text = text.replace('href={`/order?', f'href={{`{prefix}/order?')

              text = text.replace('router.push(`/order?', f'router.push(`{prefix}/order?')
              text = text.replace('router.push("/', f'router.push("{prefix}/')
              text = text.replace("router.push('/", f"router.push('{prefix}/")

              path.write_text(text)

          admin = Path('components/AdminPanel.tsx')
          text = admin.read_text()
          old = 'href={`/admin/${value}`}'
          new = 'href={`' + prefix + '/admin?section=${value}`}'
          text = text.replace(old, new)
          text = text.replace('window.location.assign("/admin/dashboard")', f'window.location.assign("{prefix}/admin/?section=dashboard")')
          text = text.replace('window.location.assign("/admin/login")', f'window.location.assign("{prefix}/admin/login/")')
          admin.write_text(text)
          PY

      - name: Build static ecommerce website
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: "https://satitech-official.github.io/Sanskriti-Mall-Premium-Ecommerce/"
        run: npm run build

      - name: Validate and fix Pages assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          root = Path('dist/client')
          prefix = '/Sanskriti-Mall-Premium-Ecommerce'
          nested_next = root / 'Sanskriti-Mall-Premium-Ecommerce' / '_next'
          root_next = root / '_next'

          # vinext + assetPrefix emits _next inside a nested repo folder.
          # GitHub project pages resolve /repo/_next/... to artifact-root/_next/...
          # so mirror those generated assets to the artifact root.
          if nested_next.exists():
              if root_next.exists():
                  shutil.rmtree(root_next)
              shutil.copytree(nested_next, root_next)

          replacements = {
              '"/images/': f'"{prefix}/images/',
              "'/images/": f"'{prefix}/images/",
              '"/og.png"': f'"{prefix}/og.png"',
              "'/og.png'": f"'{prefix}/og.png'",
              '"/favicon.svg"': f'"{prefix}/favicon.svg"',
              "'/favicon.svg'": f"'{prefix}/favicon.svg'",
          }

          for path in root.rglob('*'):
              if path.is_file() and path.suffix in {'.html', '.js', '.css', '.json'}:
                  try:
                      text = path.read_text()
                  except UnicodeDecodeError:
                      continue
                  for old, new in replacements.items():
                      text = text.replace(old, new)
                  path.write_text(text)

          if not (root / 'index.html').exists():
              raise SystemExit('GitHub Pages build invalid: index.html missing')

          css_files = list((root / '_next' / 'static' / 'css').glob('*.css'))
          js_files = list((root / '_next' / 'static' / 'chunks').glob('*.js'))
          if not css_files:
              raise SystemExit('GitHub Pages build invalid: root _next CSS missing')
          if not js_files:
              raise SystemExit('GitHub Pages build invalid: root _next JS chunks missing')

          (root / '.nojekyll').touch()
          PY

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
